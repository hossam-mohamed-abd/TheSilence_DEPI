name: Daily ETL

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, useful for testing

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      

      - name: Install Python dependencies
        working-directory: pipelines/DataWarehouse_ETL
        run: pip install -r requirements.txt

      - name: Run ETL
        working-directory: pipelines/DataWarehouse_ETL
        env:
          OLTP_DATABASE_URL: ${{ secrets.OLTP_DATABASE_URL }}
          DW_DATABASE_URL: ${{ secrets.DW_DATABASE_URL }}
          SEARCH_LOG_MODE: ${{ vars.SEARCH_LOG_MODE }}
        run: python main.py
