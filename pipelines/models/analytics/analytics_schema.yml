version: 2

# ──────────────────────────────────────────────────────────────
# models/analytics/schema.yml
#
# Documents all analytics models in the Drug Tracking System pipeline.
#
# Analytics layer responsibilities:
#   - Aggregate data from core models into summary statistics
#   - Power patient-facing drug search features (FR-8)
#   - Recomputed in full on every pipeline run
#
# Materialisation: table (persisted in DuckDB on every dbt run)
# Schema in DuckDB: main_analytics
# ──────────────────────────────────────────────────────────────

models:

  # ──────────────────────────────────────────
  # 1. DRUG_ANALYTICS
  # ──────────────────────────────────────────
  - name: drug_analytics
    description: |
      Aggregated price and availability statistics per drug,
      computed across all pharmacies that carry each drug.

      Source: core_pharmacy_inventory (one row per pharmacy/drug pair).

      Only drugs present in at least one pharmacy's inventory appear here.
      Drugs in the master catalogue (core_drugs) with no pharmacy records
      produce no analytics row — there is nothing to compute.

      Availability rule: a pharmacy counts as "having the drug available"
      when quantity > 0. This is consistent with the derivation used in
      the availability_history snapshot.

      Pushed to PostgreSQL as the drug_analytics table.
      Upsert conflict key: drug_id (one analytics record per drug).
      FK dependency: must be pushed after drugs.

      Supports FR-8: when a patient searches for a drug, the frontend
      displays min/max/avg price and the availability percentage so
      the patient can make an informed decision before visiting a pharmacy.
    columns:
      - name: id
        description: |
          Synthetic primary key. Generated by ROW_NUMBER() ordered by
          drug_id. Deterministic across runs as long as the set of drugs
          with inventory records does not change.
        tests:
          - not_null
          - unique

      - name: drug_id
        description: |
          Foreign key referencing drugs.id. Unique in this table —
          one analytics record per drug. This is the upsert conflict
          key used by push_to_postgres.py.
        tests:
          - not_null
          - unique

      - name: avg_price
        description: |
          Average retail price of this drug across all pharmacies
          that carry it, regardless of stock level.
          Rounded to 2 decimal places. Stored as NUMERIC(10,2) in PostgreSQL.

      - name: min_price
        description: |
          Lowest retail price of this drug found across all pharmacies
          that carry it. Helps patients identify the cheapest source.
          Rounded to 2 decimal places. Stored as NUMERIC(10,2) in PostgreSQL.

      - name: max_price
        description: |
          Highest retail price of this drug found across all pharmacies
          that carry it. Useful for price range display on the frontend.
          Rounded to 2 decimal places. Stored as NUMERIC(10,2) in PostgreSQL.

      - name: availability_percentage
        description: |
          Percentage of pharmacies carrying this drug that currently
          have it in stock (quantity > 0).

          Formula:
            (COUNT of pharmacies where quantity > 0)
            ÷ (COUNT of all pharmacies carrying this drug)
            × 100

          Range: 0.00 to 100.00. Rounded to 2 decimal places.
          Stored as NUMERIC(5,2) in PostgreSQL with a CHECK constraint
          enforcing the 0–100 range.

          Example: if 3 out of 5 pharmacies have quantity > 0,
          availability_percentage = 60.00.

      - name: calculated_at
        description: |
          Timestamp of when this analytics record was last computed.
          Set to CURRENT_TIMESTAMP on every pipeline run, so this
          always reflects the most recent execution time.
        tests:
          - not_null
