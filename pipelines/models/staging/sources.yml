version: 2

# ──────────────────────────────────────────────────────────────
# sources.yml
# Location: models/staging/sources.yml
#
# Documents the seed tables that form the entry point of the
# Drug Tracking System pipeline.
#
# NOTE ON USAGE
# These seeds are referenced via {{ ref('table_name') }},
# not {{ source() }}, in the staging models. This file is
# therefore documentation metadata only — it does not affect
# query execution or pipeline behaviour. Its purpose is to
# produce accurate output when running:
#     dbt docs generate
#     dbt docs serve
# ──────────────────────────────────────────────────────────────

sources:
  - name: datalake
    description: |
      Seed layer — the entry point of the Drug Tracking System pipeline.

      Data flow:
        1. Raw CSV files land in datalake/ on the local filesystem.
        2. column_normalizer.py standardises column names using a
           combination of exact matching and fuzzy matching (rapidfuzz).
        3. Normalised files are written to the seeds/ folder.
        4. `dbt seed` loads them into DuckDB under this source.
        5. Staging models clean and cast the data before it reaches
           the core and analytics layers.

      Two categories of input:

        Structured CSVs — maintained by the data team, copied directly:
          - drug_categories.csv
          - drugs.csv
          - drug_alternatives.csv

        Pharmacy inventory CSVs — uploaded by individual pharmacies,
        normalised and merged into one file per pipeline run:
          - Naming convention: pharmacy_inventory_pharmacy_<id>_<timestamp>.csv
          - Merged output:     seeds/pharmacy_inventory.csv
          - Deduplication:     most recent record per pharmacy/drug pair is kept

    tables:

      # ──────────────────────────────────────────
      # 1. DRUG_CATEGORIES
      # ──────────────────────────────────────────
      - name: drug_categories
        description: |
          Master list of drug classification categories.
          Maintained by the data team and copied directly to seeds/.

          IDs are pre-assigned in the source CSV and trusted as-is —
          they are never auto-generated by the pipeline. This is critical
          because drugs.csv references these exact IDs via category_id,
          so any ID mismatch would break the foreign key relationship.

          Downstream: stg_drug_categories → core_drug_categories → drugs table in PostgreSQL.
        columns:
          - name: id
            description: |
              Primary key of the drug_categories table.
              Assigned by the data team in the source CSV.
              Referenced as category_id in the drugs table.
            tests:
              - not_null
              - unique

          - name: name
            description: |
              Display name of the drug category.
              Examples: Antibiotics, Analgesics, Antihypertensives,
              Antidiabetics, Antihistamines, Antifungals.
              Must be unique across all categories.
            tests:
              - not_null
              - unique

          - name: description
            description: |
              Optional. Free-text description of the therapeutic purpose
              of drugs within this category. Displayed to patients and
              pharmacists on the frontend.

          - name: created_at
            description: |
              Optional. Timestamp when this category was first introduced
              into the system. May be null for historically seeded records.


      # ──────────────────────────────────────────
      # 2. DRUGS
      # ──────────────────────────────────────────
      - name: drugs
        description: |
          Master drug reference table. The central lookup for all known
          drugs in the system.
          Maintained by the data team and copied directly to seeds/.

          IDs are pre-assigned in the source CSV and trusted as-is —
          drug_alternatives.csv references these exact IDs, so ID
          stability is essential.

          drugs.csv is the single source of truth for the drug catalogue.
          Unlike an earlier version of this pipeline, there is no
          auto-add mechanism for unknown drugs: pharmacy_inventory
          carries drug_id directly (not a drug name), so there is no
          name to auto-catalogue a new drug from. An inventory row
          whose drug_id does not exist here is dropped in
          core_pharmacy_inventory.sql, not auto-added.

          Downstream: stg_drugs → core_drugs → drugs table in PostgreSQL.
          Also feeds: core_pharmacy_inventory (drug_id validation),
                      core_drug_alternatives (ID validation),
                      drug_analytics.
        columns:
          - name: id
            description: |
              Primary key of the drugs table.
              Assigned by the data team in the source CSV. This is the
              single source of drug IDs — there is no auto-assignment
              mechanism for unknown drugs (see table-level description).
            tests:
              - not_null
              - unique

          - name: name
            description: |
              Trade or brand name of the drug (e.g. Panadol, Amoxil, Augmentin).
              Must be unique across all drugs. No longer used as a join key
              downstream — pharmacy_inventory carries drug_id directly, so
              this column is descriptive/display data only from this
              pipeline's perspective.
            tests:
              - not_null
              - unique

          - name: active_substance
            description: |
              Active pharmaceutical ingredient (API) — the chemical compound
              responsible for the drug's therapeutic effect.
              Examples: Paracetamol, Amoxicillin, Ibuprofen, Metformin.
              One drug can have multiple active substances (combination drugs).
              Previously named active_ingredient in the old schema.

          - name: category_id
            description: |
              Foreign key referencing drug_categories.id.
              Determines which therapeutic classification this drug belongs to.
              Supplied in the source CSV and validated in staging.

          - name: dosage_form
            description: |
              Optional. Physical form in which the drug is administered.
              Examples: Tablet, Capsule, Syrup, Suspension, Injection,
              Cream, Ointment, Drops, Patch, Suppository.

          - name: strength
            description: |
              Optional. Concentration or quantity of the active substance
              per unit dose.
              Examples: 500mg, 250mg/5ml, 10mg/2ml, 0.1%.

          - name: manufacturer
            description: |
              Optional. Name of the pharmaceutical company that produces
              this drug. Examples: GSK, Pfizer, Novartis, Eva Pharma,
              Amoun Pharmaceutical.

          - name: description
            description: |
              Optional. Free-text clinical or general description of the
              drug's therapeutic indications, usage, or notes.
              Displayed to patients searching for drug information.

          - name: image_url
            description: |
              Optional. URL pointing to a product image of the drug
              (typically the packaging). Used by the frontend to display
              drug visuals to patients and pharmacists.

          - name: created_at
            description: |
              Optional. Timestamp when this drug record was first added
              to the system. May be null for historically seeded records.

          - name: updated_at
            description: |
              Optional. Timestamp of the most recent update to this drug
              record. Updated when any field changes (name, strength, etc.).


      # ──────────────────────────────────────────
      # 3. DRUG_ALTERNATIVES
      # ──────────────────────────────────────────
      - name: drug_alternatives
        description: |
          Maps each drug to its therapeutic alternatives.
          Represents a many-to-many relationship between drugs —
          a drug can have multiple alternatives, and each alternative
          can itself have alternatives.

          Maintained by the data team and copied directly to seeds/.

          Both directions of a pair should be present for symmetric
          alternatives. For example, if Panadol is an alternative to
          Adol, then Adol should also be listed as an alternative to
          Panadol. The pipeline does not enforce symmetry — the data
          team is responsible for supplying both directions.

          Business rule enforced in staging and core:
            - Self-references are removed (a drug cannot be its own alternative)
            - Duplicate pairs are removed
            - Both drug_id and alternative_drug_id must exist in core_drugs

          Supports FR-9: suggest alternatives when a drug is available
          in fewer than 3 pharmacies.

          Downstream: stg_drug_alternatives → core_drug_alternatives
                      → drug_alternatives table in PostgreSQL.
        columns:
          - name: drug_id
            description: |
              Foreign key referencing drugs.id.
              The primary drug for which alternatives are being listed.
            tests:
              - not_null

          - name: alternative_drug_id
            description: |
              Foreign key referencing drugs.id.
              A drug that can therapeutically substitute for drug_id.
              Must be different from drug_id (enforced by CHECK constraint).
            tests:
              - not_null


      # ──────────────────────────────────────────
      # 4. PHARMACY_INVENTORY
      # ──────────────────────────────────────────
      - name: pharmacy_inventory
        description: |
          Current stock, pricing, and quantity data for each
          pharmacy's drug inventory. This is the most frequently
          updated table in the pipeline — refreshed every 12 hours.

          Source: individual pharmacies upload CSV files following
          the naming convention:
            pharmacy_inventory_pharmacy_<pharmacy_id>_<timestamp>.csv

          These files are processed by column_normalizer.py (which
          handles non-standard column names via fuzzy matching), then
          merged and deduplicated — keeping the most recent record per
          pharmacy/drug pair — before being written to
          seeds/pharmacy_inventory.csv.

          IMPORTANT — drug identification:
            Pharmacies upload drug_id directly (our internal ID), not a
            drug name. The drug_id FK is validated downstream in
            core_pharmacy_inventory.sql via an INNER JOIN against
            core_drugs.id. Any inventory row whose drug_id does not
            exist in core_drugs is silently dropped — there is no
            auto-add mechanism, since a bare ID with no name provides
            nothing to catalogue a new drug from.

            ASSUMPTION (to be revisited): this assumes pharmacies — or
            whatever system sits between them and our pipeline —
            resolve drug names to our internal drug_id before the file
            reaches Supabase Storage.

          IMPORTANT — availability derivation:
            This table does not have an "available" boolean column.
            Availability is derived downstream wherever needed as:
              available = (quantity > 0)
            This derived value feeds both the availability_history
            snapshot and the availability_percentage in drug_analytics.

          Downstream: stg_pharmacy_inventory → core_pharmacy_inventory
                      → pharmacy_inventory table in PostgreSQL.
          Also feeds: price_history snapshot (tracks price changes),
                      availability_history snapshot (tracks stock changes),
                      drug_analytics (avg/min/max price, availability %).
        columns:
          - name: pharmacy_id
            description: |
              ID of the pharmacy that submitted this inventory record.
              Foreign key referencing pharmacies.id (the pharmacies table
              is owned by the backend team, not this pipeline).
              Extracted from the filename or provided as a column in the
              uploaded CSV.
            tests:
              - not_null

          - name: drug_id
            description: |
              Internal drug ID as provided directly by the pharmacy.
              Foreign key referencing drugs.id. Validated via INNER JOIN
              in core_pharmacy_inventory.sql — rows whose drug_id does
              not exist in the drugs table are dropped, not auto-added.
            tests:
              - not_null

          - name: price
            description: |
              Current retail price of this drug at this pharmacy, in the
              local currency (EGP). Defaults to 0.0 if the uploaded value
              is missing or cannot be parsed as a number.
              Tracked over time in the price_history snapshot.
              Used to compute avg_price, min_price, max_price in drug_analytics.
            tests:
              - not_null

          - name: quantity
            description: |
              Current number of units of this drug in stock at this pharmacy.
              Defaults to 0 if the uploaded value is missing or invalid.

              This column replaces the old "available" boolean column.
              Availability is derived from this value as: quantity > 0.

              A quantity of 0 means the drug is currently out of stock
              at this pharmacy. Tracked over time in the availability_history
              snapshot (as the derived boolean quantity > 0).
            tests:
              - not_null

          - name: minimum_stock
            description: |
              Minimum stock threshold set by the pharmacy for this drug.
              When quantity falls below this value, a low-stock condition
              exists. Defaults to 0 if not provided by the pharmacy.
              Used for alerting logic (FR-13: notify pharmacy when a
              frequently searched drug is unavailable).

          - name: last_updated
            description: |
              Timestamp of when the pharmacy last updated this stock record.
              Defaults to CURRENT_TIMESTAMP if missing from the uploaded CSV.
              Used as the deduplication key when merging multiple uploads —
              the most recent record per pharmacy/drug pair is kept.
              Also used by dbt snapshots to order change detection.
            tests:
              - not_null
